services:
  central-mongo:
    image: mongo:7.0
    container_name: cdn-server2-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - central-mongo-data:/data/db

  central-api:
    build:
      context: ..
      dockerfile: server2-central-api/Dockerfile
    container_name: cdn-server2-central-api
    restart: unless-stopped
    depends_on:
      - central-mongo
    ports:
      - "${PORT:-4000}:4000"
    environment:
      - PORT=4000
      - MONGO_URI=mongodb://central-mongo:27017
      - DB_NAME=cdn_central
      - INTERNAL_SECRET=${INTERNAL_SECRET:-cdn-super-secret-key-2026}
      - PRIMARY_NODE_ID=${PRIMARY_NODE_ID:-sg-1}
      - EDGE_SG_HOST=${EDGE_SG_HOST:-localhost:5001}
      - EDGE_SG_URL=${EDGE_SG_URL:-http://localhost:5001}
      - EDGE_NY_HOST=${EDGE_NY_HOST:-localhost:5002}
      - EDGE_NY_URL=${EDGE_NY_URL:-http://localhost:5002}
      - EDGE_LDN_HOST=${EDGE_LDN_HOST:-localhost:5003}
      - EDGE_LDN_URL=${EDGE_LDN_URL:-http://localhost:5003}

volumes:
  central-mongo-data:
