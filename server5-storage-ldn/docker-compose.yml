services:
  ldn-mongo:
    image: mongo:7.0
    container_name: cdn-server5-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27020}:27017"
    volumes:
      - ldn-mongo-data:/data/db

  storage-ldn:
    build:
      context: ..
      dockerfile: server5-storage-ldn/Dockerfile
    container_name: cdn-server5-storage-ldn
    restart: unless-stopped
    depends_on:
      - ldn-mongo
    ports:
      - "${PORT:-5003}:5003"
    environment:
      - NODE_ID=ldn-1
      - REGION=Europe
      - PORT=5003
      - MONGO_URI=mongodb://ldn-mongo:27017
      - DB_NAME=cdn_storage_ldn
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:5003}
      - INTERNAL_SECRET=${INTERNAL_SECRET:-cdn-super-secret-key-2026}

volumes:
  ldn-mongo-data:
